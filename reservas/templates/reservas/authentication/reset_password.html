{% extends 'reservas/base.html' %}

{% block content %}
<style>
    /* Estilos específicos para centrar y bajar la tarjeta */
    .hero-login-reset {
        display: flex;
        justify-content: center;
        align-items: flex-start; /* Alinea al inicio para controlar la bajada con margin */
        width: 100%;
        min-height: 80vh;
        padding-top: 80px; /* <--- Esto la baja respecto al menú */
    }

    /* Aseguramos que la tarjeta mantenga su estilo pero centrada */
    .login-card-vortex {
        margin: 0 auto;
    }
</style>

<div class="hero-login-reset">
    <div class="login-card-vortex">
        <div class="login-header">
            <h3>Nueva Contraseña</h3>
            <p>Ingresa tu nueva clave para TurnoClic</p>
        </div>
        <form method="POST" class="login-form">
            {% csrf_token %}
            <div class="input-group">
                <input type="password" name="pass1" placeholder="Nueva contraseña" required>
            </div>
            <div class="input-group">
                <input type="password" name="pass2" placeholder="Repetir contraseña" required>
            </div>
            <button type="submit" class="btn-login-vortex">CAMBIAR CONTRASEÑA</button>
        </form>
    </div>
</div>
{% endblock %}
