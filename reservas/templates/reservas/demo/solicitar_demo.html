{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solicitar Servicio | TURNOCLIC</title>
    <link rel="stylesheet" href="{% static 'reservas/css/demo.css' %}?v=1.3" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{% static 'reservas/js/loading1.js' %}?v=1.0"></script>
    <script src="{% static 'reservas/js/demo.js' %}?v=1.0"></script>
  </head>
  <body>
    <div class="form-card">
      <header class="brand-container">
        <h1 class="brand-title">TURNO<span class="highlight-clic">CLIC</span></h1>
        <p>
          Pruebe el sistema por un mes <strong>¡GRATIS!</strong>
        </p>
      </header>
      <form id="form-demo" method="POST" action="{% url 'guardar_solicitud_demo' %}">
        {% csrf_token %}
        <div class="section-header">Datos del Usuario</div>
        <div class="input-row">
          <input type="text" name="nombre" placeholder="Nombres" required />
          <input type="text" name="apellidos" placeholder="Apellidos" required />
        </div>
        <input type="email" name="email" placeholder="Correo electrónico" required />
        <input type="tel" name="telefono" placeholder="Teléfono" required />
        <input type="password" name="password" placeholder="Crea tu contraseña" required />

        <div class="section-header">Tipo de Servicio</div>
        <div class="service-grid">
          <div class="service-card active" data-rubro="hora" onclick="cambiarRubro('hora', this)">
            <span class="card-icon">🕒</span>
            <span>Una Hora ó Cupo</span>
          </div>
          <div class="service-card" data-rubro="espacio" onclick="cambiarRubro('espacio', this)">
            <span class="card-icon">🏟️</span>
            <span>Un Espacio ó Recinto</span>
          </div>
          <div class="service-card" data-rubro="atencion" onclick="cambiarRubro('atencion', this)">
            <span class="card-icon">🏥</span>
            <span>Atención o Tratamiento</span>
          </div>
          <div class="service-card" data-rubro="clase" onclick="cambiarRubro('clase', this)">
            <span class="card-icon">👨‍🏫</span>
            <span>Sesión o Clase</span>
          </div>
        </div>

        <select id="select-categorias" name="tipo_servicio">
          <option value="">Seleccione..</option>
        </select>

        <input type="hidden" name="rubro_seleccionado" id="rubro_seleccionado" value="hora" />

        <div class="section-header">Acceso Público</div>
        <div class="url-input-container">
          <span class="url-addon">https://</span>
          <input type="text" name="slug_negocio" placeholder="tu-negocio" />
          <span class="url-addon">.turnoclic.cl</span>
        </div>

        <div class="action-buttons">
          <button type="submit" class="btn-primary-clic">SOLICITAR SERVICIO</button>
          <a href="{% url 'home' %}" class="btn-cancel-clic"><i class="fas fa-arrow-left"></i> VOLVER AL INICIO</a>
        </div>
      </form>
    </div>

    <script>
      // Datos de rubros
      const rubros = {
        hora: ['Barbería', 'Consulta médica', 'Consulta profesional', 'Medicina Alternativa', 'Peluquería', 'Salón de Belleza'],
        espacio: ['Multicanchas', 'Oficinas', 'Recintos', 'Salones'],
        atencion: ['Centro de atención', 'Kinesiología', 'Dental'],
        clase: ['Clases grupales', 'Yoga', 'Entrenamiento']
      }
      
      function cambiarRubro(key, element) {
        document.querySelectorAll('.service-card').forEach((c) => c.classList.remove('active'))
        element.classList.add('active')
      
        const select = document.getElementById('select-categorias')
        select.innerHTML = '<option value="">Seleccione..</option>'
      
        rubros[key].forEach((item) => {
          const opt = document.createElement('option')
          opt.value = item.toLowerCase().replace(' ', '_')
          opt.textContent = item
          select.appendChild(opt)
        })
      
        document.getElementById('rubro_seleccionado').value = key
      }
      
      // Inicializar
      window.onload = () => cambiarRubro('hora', document.querySelector('.service-card.active'))
      
      // Envío con SweetAlert2 y efecto de carga
      const formDemo = document.getElementById('form-demo')
      if (formDemo) {
        formDemo.addEventListener('submit', function(e) {
          e.preventDefault()
          
          // Mostrar efecto de carga
          mostrarLoading()
          
          const formData = new FormData(this)
          
          fetch("{% url 'guardar_solicitud_demo' %}", {
            method: 'POST',
            body: formData,
            headers: {
              'X-Requested-With': 'XMLHttpRequest'
            }
          })
          .then((response) => response.json())
          .then((data) => {
            ocultarLoading()
            
            if (data.success) {
              Swal.fire({
                icon: 'success',
                title: '¡Solicitud Enviada!',
                text: data.message,
                confirmButtonColor: '#3085d6',
                confirmButtonText: 'Perfecto'
              }).then(() => {
                window.location.href = "{% url 'login' %}"
              })
            } else {
              Swal.fire({
                icon: 'error',
                title: 'Error',
                text: data.error || 'Hubo un problema al enviar tu solicitud.',
                confirmButtonColor: '#d33'
              })
            }
          })
          .catch((error) => {
            ocultarLoading()
            Swal.fire({
              icon: 'error',
              title: 'Error de conexión',
              text: 'No se pudo conectar con el servidor. Intenta nuevamente.',
              confirmButtonColor: '#d33'
            })
          })
        })
      }
    </script>
  </body>
</html>
